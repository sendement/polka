[package]
name = "polka"
version = "0.46.3"
edition = "2024"
license = "MIT"
description = "Gamepad-first dual-pane file manager"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["svg_text", "image", "file"] }
egui-winit = { version = "0.36", default-features = false, features = ["clipboard", "wayland", "x11"] }
raw-window-handle = "0.6"
base64 = "0.22"
percent-encoding = "2"
rayon = "1.12"
libc = "0.2"
zbus = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "bmp", "gif", "webp", "tiff"] }
gilrs = "0.11"
compress-tools = "0.16"
freedesktop-icons = "0.4"
freedesktop-desktop-entry = "0.8"
pelite = "0.10"
trash = "5"
roxmltree = "0.20"
zip = { version = "9", default-features = false, features = ["deflate", "bzip2", "zstd", "aes-crypto"] }
tar = "0.4"
flate2 = "1"
zstd = { version = "0.14", features = ["zstdmt", "pkg-config"] }
xz2 = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "7"
mime_guess = "2"
# Tables: spreadsheets read (xlsx, xls, xlsb, ods), xlsx written, CSV.
calamine = { version = "0.37", features = ["dates"] }
rust_xlsxwriter = "0.101"
csv = "1.4"
encoding_rs = "0.8"
crossbeam-channel = "0.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
md5 = "0.8"
png = "0.17"
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-md = "0.5"
tree-sitter-yaml = "0.7"
tree-sitter-lua = "0.5"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-make = "1"
tree-sitter-ini = "1"
tree-sitter-diff = "0.1"
tree-sitter-zig = "1"
tree-sitter-nix = "0.3"
tree-sitter-cmake = "0.7"
tree-sitter-sequel = "0.3"
tree-sitter-qmljs = "0.3"
tree-sitter-glsl = "0.2"
regex = "1"
pulldown-cmark = { version = "0.13", default-features = false }
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-all", "symphonia-simd"] }
lofty = "0.25"
serde_json = "1"
alacritty_terminal = "0.26.0"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
# raster-images: SVG icons that wrap a PNG (Windows-look themes) draw.
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }

# egui-winit with one change: Polka's own Wayland clipboard (see
# vendor/egui-winit/POLKA-NOTICE.md).
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
