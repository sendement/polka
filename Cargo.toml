[package]
name = "polka"
version = "0.3.4"
edition = "2024"
license = "MIT"
description = "Gamepad-first dual-pane file manager"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["svg", "image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "bmp", "gif", "webp", "tiff"] }
gilrs = "0.11"
compress-tools = "0.16"
freedesktop-icons = "0.4"
freedesktop-desktop-entry = "0.8"
pelite = "0.10"
trash = "5"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
zstd = { version = "0.14", features = ["zstdmt", "pkg-config"] }
xz2 = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "7"
mime_guess = "2"
crossbeam-channel = "0.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
md5 = "0.8"
png = "0.17"

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
